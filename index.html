<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Music Player PWA</title>
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { font-family: Arial, sans-serif; background:#121212; color:#fff; margin:0; padding:0; }
header { padding:20px; text-align:center; font-size:1.6rem; background:#1f1f1f; }
.albums { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; padding:16px; }
.album { background:#1f1f1f; border-radius:10px; overflow:hidden; text-align:center; padding:10px; }
.album img { width:100%; height:200px; object-fit:cover; border-radius:8px; }
.album h3 { margin:10px 0 4px 0; font-size:1rem; }
.album p { margin:0 0 8px 0; font-size:0.85rem; color:#bbb; }
.tracks { text-align:left; margin-top:8px; max-height:180px; overflow:auto; }
.track { padding:8px; cursor:pointer; border-bottom:1px solid #2a2a2a; }
.track:hover { background:#222; }
.player { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px; background:#141414; border-top:1px solid #2b2b2b; }
.controls { display:flex; gap:8px; align-items:center; }
.btn { background:#4fc3f7; border:none; color:#111; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:600; }
.info { flex:1; padding-left:12px; font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
audio { width:260px; }
.msg { padding:20px; text-align:center; color:#bbb; }
@media (max-width:520px){
  .album img { height:150px; }
  audio { width:160px; }
}
</style>
</head>
<body>
<header>🎵 My Music Player</header>

<div id="albums" class="albums"><div class="msg">Загрузка...</div></div>

<div id="player" class="player" style="display:none;">
  <div class="info" id="player-info">—</div>
  <div class="controls">
    <button id="prev" class="btn">⏮</button>
    <button id="play" class="btn">▶</button>
    <button id="next" class="btn">⏭</button>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script>
// Регистрируем сервис-воркер
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(()=>console.log('Service worker registered'))
  .catch(e=>console.warn('SW register failed:', e));
}

// Глобальные переменные
let albumsData = {};
let currentAlbum = null;
let currentTrackIndex = 0;

const albumsContainer = document.getElementById('albums');
const player = document.getElementById('player');
const audio = document.getElementById('audio');
const playerInfo = document.getElementById('player-info');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

// Загружаем music.json
fetch('music.json')
.then(res => {
  if (!res.ok) throw new Error('music.json not found (' + res.status + ')');
  return res.json();
})
.then(tracks => {
  if (!Array.isArray(tracks) || tracks.length === 0) {
    albumsContainer.innerHTML = '<div class="msg">music.json пуст или неверный формат.</div>';
    return;
  }
  tracks.forEach(t => {
    const albumName = t.album || 'Unknown Album';
    if (!albumsData[albumName]) albumsData[albumName] = { cover: t.cover || null, tracks: [] };
    albumsData[albumName].tracks.push({ title: t.title || t.url, artist: t.artist || '', url: t.url });
  });
  renderAlbums();
})
.catch(err => {
  console.error(err);
  albumsContainer.innerHTML = '<div class="msg">Не удалось загрузить music.json — проверьте файл и пути.</div>';
});

// Рендерим альбомы
function renderAlbums(){
  albumsContainer.innerHTML = '';
  for (const albumName of Object.keys(albumsData)) {
    const album = albumsData[albumName];
    const div = document.createElement('div');
    div.className = 'album';
    const coverSrc = album.cover ? album.cover : 'https://via.placeholder.com/400x400?text=No+Cover';
    const artist = album.tracks[0] && album.tracks[0].artist ? album.tracks[0].artist : '';
    div.innerHTML = `
      <img src="${coverSrc}" alt="cover">
      <h3>${escapeHtml(albumName)}</h3>
      <p>${escapeHtml(artist)}</p>
      <div class="tracks">
        ${album.tracks.map((t,i)=>`<div class="track" data-album="${escapeAttr(albumName)}" data-index="${i}">${escapeHtml(t.title)}</div>`).join('')}
      </div>
    `;
    albumsContainer.appendChild(div);
  }
  document.querySelectorAll('.track').forEach(el => {
    el.addEventListener('click', () => {
      currentAlbum = el.dataset.album;
      currentTrackIndex = parseInt(el.dataset.index, 10);
      playTrack();
    });
  });
}

// Воспроизведение
function playTrack(){
  if (!currentAlbum) return;
  const album = albumsData[currentAlbum];
  if (!album) return;
  const track = album.tracks[currentTrackIndex];
  if (!track) return;
  audio.src = track.url;
  audio.play().catch(err => console.warn('play failed:', err));
  playerInfo.textContent = `${track.artist} — ${track.title}`;
  player.style.display = 'flex';
  playBtn.textContent = '⏸';
}

// Кнопки управления
playBtn.addEventListener('click', ()=>{
  if (audio.paused) { audio.play().catch(()=>{}); playBtn.textContent='⏸'; }
  else { audio.pause(); playBtn.textContent='▶'; }
});
prevBtn.addEventListener('click', ()=>{
  if (!currentAlbum) return;
  const len = albumsData[currentAlbum].tracks.length;
  currentTrackIndex = (currentTrackIndex - 1 + len) % len;
  playTrack();
});
nextBtn.addEventListener('click', ()=>{
  if (!currentAlbum) return;
  const len = albumsData[currentAlbum].tracks.length;
  currentTrackIndex = (currentTrackIndex + 1) % len;
  playTrack();
});

// Утилиты для безопасного отображения текста
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return (''+s).replace(/"/g, '&quot;'); }

console.log('Если вы ранее использовали service worker, откройте DevTools → Application → Service Workers → Unregister и перезагрузите страницу.');
</script>
</body>
</html>
