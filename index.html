<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3 Expressive Fullscreen Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-fullscreen">
        <!-- Адаптивный Fullscreen Экран вывода -->
        <div class="display">
            <div class="previous-operand" id="previous"></div>
            <div class="current-operand" id="current">0</div>
        </div>

        <!-- Полноэкранная Клавиатура -->
        <div class="keypad">
            <!-- Верхний ряд действий -->
            <button class="btn btn-action" data-action="clear">AC</button>
            <button class="btn btn-action" data-action="delete">⌫</button>
            <button class="btn btn-operator" data-action="operator">%</button>
            <button class="btn btn-operator" data-action="operator">÷</button>

            <!-- Основной блок -->
            <button class="btn btn-number" data-action="number">7</button>
            <button class="btn btn-number" data-action="number">8</button>
            <button class="btn btn-number" data-action="number">9</button>
            <button class="btn btn-operator" data-action="operator">×</button>

            <button class="btn btn-number" data-action="number">4</button>
            <button class="btn btn-number" data-action="number">5</button>
            <button class="btn btn-number" data-action="number">6</button>
            <button class="btn btn-operator" data-action="operator">−</button>

            <button class="btn btn-number" data-action="number">1</button>
            <button class="btn btn-number" data-action="number">2</button>
            <button class="btn btn-number" data-action="number">3</button>
            <button class="btn btn-operator" data-action="operator">+</button>

            <!-- Нижний ряд -->
            <button class="btn btn-number btn-zero" data-action="number">0</button>
            <button class="btn btn-number" data-action="number">,</button>
            <button class="btn btn-equals" data-action="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
