<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator · M3 Expressive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scrim"></div>

  <main class="calc-wrapper">

    <!-- Theme toggle -->
    <button class="theme-fab" id="themeToggle" aria-label="Toggle theme" title="Switch theme">
      <span class="theme-icon" id="themeIcon">🌙</span>
    </button>

    <!-- Card container -->
    <div class="calc-card" role="region" aria-label="Calculator">

      <!-- Display -->
      <div class="display" aria-live="polite">
        <div class="display__expression" id="expression" aria-label="Expression"></div>
        <div class="display__result" id="result" aria-label="Result">0</div>
      </div>

      <!-- Keypad -->
      <div class="keypad" role="grid">

        <!-- Row 1 -->
        <button class="key key--function key--wide" data-action="clear" aria-label="All clear">AC</button>
        <button class="key key--function" data-action="sign"   aria-label="Toggle sign">+/−</button>
        <button class="key key--function" data-action="percent" aria-label="Percent">%</button>
        <button class="key key--operator" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="key key--digit" data-action="digit" data-value="7">7</button>
        <button class="key key--digit" data-action="digit" data-value="8">8</button>
        <button class="key key--digit" data-action="digit" data-value="9">9</button>
        <button class="key key--operator" data-action="operator" data-value="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="key key--digit" data-action="digit" data-value="4">4</button>
        <button class="key key--digit" data-action="digit" data-value="5">5</button>
        <button class="key key--digit" data-action="digit" data-value="6">6</button>
        <button class="key key--operator" data-action="operator" data-value="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="key key--digit" data-action="digit" data-value="1">1</button>
        <button class="key key--digit" data-action="digit" data-value="2">2</button>
        <button class="key key--digit" data-action="digit" data-value="3">3</button>
        <button class="key key--operator" data-action="operator" data-value="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="key key--digit key--wide" data-action="digit" data-value="0" aria-label="Zero">0</button>
        <button class="key key--digit" data-action="dot" aria-label="Decimal point">.</button>
        <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
