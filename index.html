<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music</title>
<style>
body {
  font-family: 'Montserrat', sans-serif;
  background: #121212;
  color: #fff;
  margin: 0;
  padding: 0;
}
header {
  padding: 1rem;
  text-align: center;
  font-size: 2rem;
  font-weight: bold;
}
#error-log {
  background: #300;
  color: #faa;
  padding: 1rem;
  margin: 1rem;
  white-space: pre-wrap;
}
.track-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 1rem;
  gap: 1rem;
}
.track-card {
  background: #1e1e1e;
  border-radius: 10px;
  padding: 0.5rem;
  width: 200px;
  text-align: center;
}
.track-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}
.audio-player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #1e1e1e;
  padding: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.audio-player audio {
  width: 70%;
}
</style>
</head>
<body>
<header>Music</header>
<div id="error-log"></div>
<div class="track-list" id="track-list"></div>

<div class="audio-player">
  <audio id="player" controls></audio>
  <div id="player-info"></div>
</div>

<script>
const errorLog = document.getElementById('error-log');
const trackListContainer = document.getElementById('track-list');
const player = document.getElementById('player');
const playerInfo = document.getElementById('player-info');

function logError(msg) {
  console.error(msg);
  errorLog.textContent += msg + "\n";
}

fetch('music.json')
  .then(res => {
    if (!res.ok) throw new Error(`Ошибка загрузки music.json: ${res.status}`);
    return res.json();
  })
  .then(tracks => {
    if (!tracks || tracks.length === 0) {
      logError("⚠ Ничего не найдено в music.json!");
      return;
    }

    tracks.forEach(track => {
      try {
        const card = document.createElement('div');
        card.className = 'track-card';

        const img = document.createElement('img');
        img.src = track.cover || '';
        img.alt = track.album || 'No cover';
        card.appendChild(img);

        const title = document.createElement('div');
        title.textContent = track.title || 'No title';
        card.appendChild(title);

        const artist = document.createElement('div');
        artist.textContent = track.artist || 'Unknown Artist';
        card.appendChild(artist);

        card.addEventListener('click', () => {
          player.src = track.url;
          player.play();
          playerInfo.textContent = `${track.artist} — ${track.title}`;
        });

        trackListContainer.appendChild(card);
      } catch(e) {
        logError(`Ошибка при обработке трека: ${track.url}\n${e}`);
      }
    });
  })
  .catch(e => logError("Ошибка при загрузке music.json:\n" + e));
</script>
</body>
</html>
