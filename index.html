<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Montserrat', sans-serif;
  margin: 0;
  padding: 0;
  background: #121212;
  color: #fff;
}
header {
  padding: 1rem;
  text-align: center;
  font-size: 2rem;
  font-weight: bold;
}
#search {
  display: block;
  width: 90%;
  max-width: 500px;
  margin: 0 auto 1rem;
  padding: 0.5rem;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
}
.error-log {
  background: #300;
  color: #faa;
  padding: 1rem;
  margin: 1rem;
  white-space: pre-wrap;
}
.artist-list, .track-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  padding: 1rem;
}
.card {
  background: #1e1e1e;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  cursor: pointer;
  flex: 1 0 180px;
  max-width: 200px;
}
.card img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
}
.card div {
  padding: 0.5rem;
}
.audio-player {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #1e1e1e;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.5rem;
}
.audio-player-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.audio-player audio {
  width: 70%;
}
.player-info {
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 600px) {
  .card {
    flex: 1 0 45%;
  }
  .audio-player {
    padding: 0.25rem;
  }
  .audio-player audio {
    width: 60%;
  }
  .player-info {
    font-size: 0.8rem;
  }
}
</style>
</head>
<body>
<header>Music</header>
<input type="text" id="search" placeholder="Поиск по трекам, артистам, альбомам...">
<div class="error-log" id="error-log"></div>
<div class="artist-list" id="artist-list"></div>
<div class="track-list" id="track-list"></div>

<div class="audio-player" id="audio-player">
  <div class="audio-player-controls">
    <audio id="player" controls></audio>
    <div class="player-info" id="player-info"></div>
  </div>
</div>

<script>
const errorLog = document.getElementById('error-log');
const artistListContainer = document.getElementById('artist-list');
const trackListContainer = document.getElementById('track-list');
const searchInput = document.getElementById('search');
const player = document.getElementById('player');
const playerInfo = document.getElementById('player-info');

let tracks = [];
let artists = {};

function logError(msg) {
  console.error(msg);
  errorLog.textContent += msg + "\n";
}

// Загрузка music.json
fetch('music.json')
  .then(res => {
    if (!res.ok) throw new Error(`Ошибка загрузки music.json: ${res.status}`);
    return res.json();
  })
  .then(data => {
    if (!data || data.length === 0) {
      logError("⚠ Ничего не найдено в music.json!");
      return;
    }
    tracks = data;

    // Формируем список артистов
    data.forEach(track => {
      if (!artists[track.artist]) artists[track.artist] = [];
      artists[track.artist].push(track);
    });

    renderArtists();
    renderTracks(tracks);
  })
  .catch(e => logError("Ошибка при загрузке music.json:\n" + e));

function renderArtists() {
  artistListContainer.innerHTML = '';
  for (let artist in artists) {
    const card = document.createElement('div');
    card.className = 'card';
    const cover = artists[artist][0].cover || '';
    card.innerHTML = `<img src="${cover}" alt="${artist}"><div>${artist}</div>`;
    card.onclick = () => renderTracks(artists[artist]);
    artistListContainer.appendChild(card);
  }
}

function renderTracks(list) {
  trackListContainer.innerHTML = '';
  list.forEach(track => {
    const card = document.createElement('div');
    card.className = 'card';
    const cover = track.cover || '';
    card.innerHTML = `<img src="${cover}" alt="${track.title}"><div>${track.title}</div><div>${track.album}</div>`;
    card.onclick = () => playTrack(track);
    trackListContainer.appendChild(card);
  });
}

function playTrack(track) {
  player.src = track.url;
  player.play();
  playerInfo.textContent = `${track.artist} — ${track.title}`;
}

// Авто-переход на следующий трек
player.addEventListener('ended', () => {
  let currentIndex = tracks.findIndex(t => t.url === player.src.split('/').pop());
  if (currentIndex >= 0 && currentIndex < tracks.length - 1) {
    playTrack(tracks[currentIndex + 1]);
  }
});

// Поиск
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  const filtered = tracks.filter(t =>
    (t.title && t.title.toLowerCase().includes(query)) ||
    (t.artist && t.artist.toLowerCase().includes(query)) ||
    (t.album && t.album.toLowerCase().includes(query))
  );
  renderTracks(filtered);
});
</script>
</body>
</html>
